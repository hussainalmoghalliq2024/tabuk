<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تبوك - نظام المصروفات المشتركة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1e2530;--bdr:#2a3441;
  --blue:#4f8ef7;--blue-d:#2a4a8f;--blue-g:rgba(79,142,247,.15);
  --green:#2ea44f;--green-g:rgba(46,164,79,.12);
  --red:#f85149;--red-g:rgba(248,81,73,.12);
  --amber:#e8a020;--amber-g:rgba(232,160,32,.12);
  --purple:#a78bfa;--purple-g:rgba(167,139,250,.12);
  --txt:#e6edf3;--mut:#7d8590;--mut2:#4a5568;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;direction:rtl;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0d1117,#161b22,#0a1220);border-bottom:1px solid var(--blue-d);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.logo{width:44px;height:44px;background:radial-gradient(circle at 30% 30%,var(--blue),var(--blue-d));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.hdr h1{font-size:20px;font-weight:900;color:var(--blue);}
.hdr .sub{font-size:11px;color:var(--mut);}
#file-time{font-size:10px;color:var(--mut);margin-top:1px;}
@keyframes spin{to{transform:rotate(360deg);}}
.sync-btn{font-family:'Tajawal',sans-serif;background:var(--blue-g);border:1px solid var(--blue-d);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.sync-btn:hover{background:rgba(79,142,247,.25);}
.sync-btn.spin .si{animation:spin .8s linear infinite;}

/* TABS */
.tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--bdr);background:var(--sur);overflow-x:auto;}
.tab{padding:8px 18px;border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:none;font-family:'Tajawal',sans-serif;font-size:14px;cursor:pointer;color:var(--mut);background:transparent;white-space:nowrap;}
.tab.active{background:var(--bg);color:var(--blue);border-color:var(--bdr);border-bottom-color:var(--bg);margin-bottom:-1px;font-weight:700;}
.tab:hover:not(.active){color:var(--txt);background:var(--sur2);}

/* LAYOUT */
.main{padding:22px 24px;max-width:1200px;margin:0 auto;}
.panel{display:none;}.panel.active{display:block;}

/* BANNER */
#banner{font-size:12px;font-weight:600;padding:10px 14px;border-radius:8px;margin-bottom:18px;display:none;}
#banner.L{background:var(--blue-g);border:1px solid var(--blue-d);color:var(--blue);display:block;}
#banner.S{background:var(--green-g);border:1px solid var(--green);color:var(--green);display:block;}
#banner.E{background:var(--red-g);border:1px solid var(--red);color:var(--red);display:block;}

/* LOADING */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:var(--mut);font-size:14px;}
.spinner{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:14px 16px;}
.card .cl{font-size:11px;color:var(--mut);margin-bottom:6px;}
.card .cv{font-size:20px;font-weight:700;direction:ltr;}
.card .cs{font-size:11px;color:var(--mut);margin-top:3px;}
.cv.blue{color:var(--blue);}.cv.green{color:var(--green);}.cv.red{color:var(--red);}.cv.amber{color:var(--amber);}

/* SECTION TITLE */
.stitle{font-size:14px;font-weight:700;color:var(--blue);margin:20px 0 12px;}
.stitle:first-child{margin-top:0;}

/* MEMBER GRID */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px;}
.mcard{background:var(--sur);border:1px solid var(--bdr);border-radius:13px;overflow:hidden;cursor:pointer;transition:all .18s;}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35);}
.mcard-h{padding:14px 16px 10px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;}
.mav{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.mname{font-size:14px;font-weight:700;}
.mrole{font-size:11px;color:var(--mut);margin-top:1px;}
.mcard-b{padding:10px 16px;}
.mr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:13px;}
.mr:last-child{border-bottom:none;}
.mrl{color:var(--mut);}
.mrr{font-weight:600;}
.mcard-f{padding:9px 16px;background:var(--sur2);display:flex;justify-content:space-between;align-items:center;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;}
.b-paid{background:var(--green-g);color:var(--green);border:1px solid var(--green);}
.b-unpaid{background:var(--red-g);color:var(--red);border:1px solid var(--red);}
.b-partial{background:var(--amber-g);color:var(--amber);border:1px solid var(--amber);}
.b-future{background:rgba(125,133,144,.08);color:var(--mut);border:1px solid var(--bdr);}
.b-na{background:rgba(125,133,144,.08);color:var(--mut2);border:1px solid var(--bdr);}
.b-blue{background:var(--blue-g);color:var(--blue);border:1px solid var(--blue-d);}
.b-purple{background:var(--purple-g);color:var(--purple);border:1px solid var(--purple);}

/* DETAIL PAGE */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;cursor:pointer;padding:6px 11px;border:1px solid var(--bdr);border-radius:7px;margin-bottom:18px;transition:all .15s;}
.back:hover{color:var(--txt);border-color:var(--blue);}
.det-hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.det-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
.det-name{font-size:20px;font-weight:900;}
.det-role{font-size:12px;color:var(--mut);margin-top:3px;}

/* TOTALS BOX */
.totals-box{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:16px 18px;margin-bottom:20px;}
.tot-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:14px;}
.tot-row:last-child{border-bottom:none;padding-top:10px;font-size:16px;font-weight:700;}
.tot-l{color:var(--mut);}
.tot-v{font-weight:700;direction:ltr;}

/* MONTH STATUS GRID */
.ms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px;}
.ms-card{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
.ms-top{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);}
.ms-mname{font-size:14px;font-weight:700;}
.ms-body{padding:12px 16px;}
.ms-amount-main{font-size:19px;font-weight:700;direction:ltr;margin-bottom:4px;}
.ms-amount-sub{font-size:11px;color:var(--mut);}
.ms-detail-list{margin-top:8px;border-top:1px solid var(--bdr);padding-top:8px;}
.ms-dl-row{display:flex;justify-content:space-between;align-items:flex-start;padding:3px 0;font-size:12px;gap:8px;}
.ms-dl-desc{color:var(--mut);flex:1;line-height:1.3;}
.ms-dl-amt{font-weight:600;direction:ltr;flex-shrink:0;}
.ms-dl-date{font-size:10px;color:var(--mut2);margin-bottom:1px;}

/* TABLE */
.twrap{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;overflow-x:auto;margin-bottom:18px;}
.twrap-h{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);}
.twrap-t{font-size:13px;font-weight:700;}
table{width:100%;border-collapse:collapse;min-width:400px;}
thead{background:var(--sur2);}
th{padding:9px 13px;font-size:11px;font-weight:600;color:var(--mut);text-align:right;border-bottom:1px solid var(--bdr);white-space:nowrap;}
td{padding:9px 13px;font-size:13px;border-bottom:1px solid var(--bdr);}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.02);}
.apos{color:var(--red);font-weight:600;direction:ltr;display:inline-block;}
.aneg{color:var(--green);font-weight:600;direction:ltr;display:inline-block;}

/* CHIP */
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;}

/* PILLS */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pill{font-family:'Tajawal',sans-serif;font-size:13px;padding:5px 13px;border-radius:99px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;}
.pill:hover,.pill.active{border-color:var(--blue-d);background:var(--blue-g);color:var(--blue);}

/* MONTHS OVERVIEW */
.mo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px;}
.mo-card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:13px 15px;cursor:pointer;transition:border-color .15s;}
.mo-card:hover{border-color:var(--blue);}
.mo-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.mo-name{font-size:14px;font-weight:700;}
.mo-sv{font-size:16px;font-weight:700;color:var(--blue);}
.mo-sl{font-size:10px;color:var(--mut);}
.ptrack{background:var(--bdr);border-radius:99px;height:4px;overflow:hidden;margin-bottom:10px;}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-d),var(--blue));}
.brow{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:4px;}
.bl{width:70px;flex-shrink:0;}
.bt{flex:1;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.bf{height:100%;border-radius:2px;}
.bv{width:60px;text-align:left;color:var(--mut);font-size:11px;}
#mo-det-sec{display:none;margin-top:18px;border-top:1px solid var(--bdr);padding-top:18px;}

@media(max-width:640px){
  .hdr{padding:12px 14px;}.tabs{padding:10px 12px 0;}.main{padding:14px 12px;}
  .cards{grid-template-columns:1fr 1fr;}.ms-grid{grid-template-columns:1fr;}
  .mgrid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <div class="logo">🏠</div>
    <div>
      <h1>مصروفات تبوك</h1>
      <div class="sub">نظام متابعة المصروفات المشتركة</div>
      <div id="file-time">جاري التحقق من GitHub...</div>
    </div>
  </div>
  <button class="sync-btn" onclick="syncNow()">
    <svg class="si" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
    مزامنة من GitHub
  </button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab(0,this)">📊 نظرة عامة</button>
  <button class="tab" onclick="showTab(1,this)">👥 الأعضاء</button>
  <button class="tab" onclick="showTab(2,this)">📅 الشهور</button>
  <button class="tab" onclick="showTab(3,this)">🧾 المصروفات</button>
  <button class="tab" onclick="showTab(4,this)">🔄 التحويلات</button>
</div>

<div class="main">
  <div id="banner"></div>
  <div id="loading"><div class="spinner"></div><div>جاري تحميل البيانات من GitHub...</div></div>
  <div id="app" style="display:none">

    <div class="panel active" id="tab0">
      <div class="stitle">ملخص عام</div>
      <div class="cards" id="ov-cards"></div>
      <div class="stitle">ملخص الأعضاء</div>
      <div class="mgrid" id="ov-members"></div>
    </div>

    <div class="panel" id="tab1">
      <div id="mem-list">
        <div class="stitle">اختر عضواً لعرض تفاصيله الكاملة</div>
        <div class="mgrid" id="mem-grid"></div>
      </div>
      <div id="mem-det" style="display:none">
        <div class="back" onclick="closeDet()">← رجوع للأعضاء</div>
        <div id="mem-det-body"></div>
      </div>
    </div>

    <div class="panel" id="tab2">
      <div class="stitle">المصاريف الشهرية المشتركة</div>
      <div class="mo-grid" id="mo-grid"></div>
      <div id="mo-det-sec"><div id="mo-det-body"></div></div>
    </div>

    <div class="panel" id="tab3">
      <div class="stitle">جميع المصروفات</div>
      <div class="pills" id="exp-pills"></div>
      <div class="twrap">
        <table><thead><tr><th>الشهر</th><th>البيان</th><th>المبلغ</th><th>الدافع</th></tr></thead>
        <tbody id="exp-body"></tbody></table>
      </div>
    </div>

    <div class="panel" id="tab4">
      <div class="stitle">التحويلات المباشرة بين الطرفين</div>
      <div class="cards" id="tr-cards"></div>
      <div class="twrap">
        <table><thead><tr><th>التاريخ</th><th>التحويل</th><th>المبلغ</th><th>الشهر</th></tr></thead>
        <tbody id="tr-body"></tbody></table>
      </div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// CONFIG — adjust REPO/FILE once this is pushed to GitHub
// ═══════════════════════════════════════════════════
const REPO    = 'hussainalmoghalliq2024/tabuk';
// Tries each candidate filename in order until one loads — so a rename on GitHub
// doesn't silently break the page. Add/edit entries here if the file gets renamed again.
const FILE_CANDIDATES = [
  'tabuk_shared_expenses.xlsx',
  'Tabuk_Shared_Expenses.xlsx',
  'Tabuk Shared Expenses.xlsx',
  'tabuk shared expenses.xlsx',
];
const CACHE_K = 'tabuk_v2';
let RESOLVED_FILE = null; // set once a candidate succeeds

// ═══════════════════════════════════════════════════
// DATE / MONTH UTILITIES
// ═══════════════════════════════════════════════════
const AR_M = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_M_IDX = {'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'سبتمبر':9,'أكتوبر':10,'نوفمبر':11,'ديسمبر':12};

function parseArMonth(s){
  if(!s) return null;
  const m = String(s).trim().match(/^([\u0600-\u06FF]+)\s+(\d{4})$/);
  if(!m) return null;
  const idx = AR_M_IDX[m[1]];
  if(!idx) return null;
  return parseInt(m[2])*100+idx;
}
function mkLabel(k){ if(!k) return '—'; return `${AR_M[k%100]} ${Math.floor(k/100)}`; }
function fmtDateShort(s){ const p=serialParts(s); if(!p) return '—'; return `${p.d} ${AR_M[p.m]}`; }
function fmtDateFull(s){ const p=serialParts(s); if(!p) return '—'; return `${p.d} ${AR_M[p.m]} ${p.y}`; }
function serialParts(s){
  if (typeof s !== 'number' || s < 1) return null;
  let n = Math.floor(s);
  if (n === 60) return {y:1900,m:2,d:29};
  if (n > 60) n--;
  const d = new Date(Date.UTC(1899,11,31));
  d.setUTCDate(d.getUTCDate() + n);
  return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate()};
}
function n(v){ if(typeof v==='number') return v; if(typeof v==='string'){const x=parseFloat(v.replace(/,/g,''));return isNaN(x)?0:x;} return 0; }
function fmt(v,d=2){ if(v==null||isNaN(v)) return '—'; return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+' ر.س'; }

// ═══════════════════════════════════════════════════
// MEMBER CONFIG
// ═══════════════════════════════════════════════════
const M = {
  hjm: {key:'hjm', name:'حسين المغلق', abbr:'HJM', ini:'حم', c:'var(--blue)',   bg:'rgba(79,142,247,.15)',  bdr:'#4f8ef7', sheet:'حسين المغلق'},
  mq:  {key:'mq',  name:'محمد قريش',   abbr:'MQ',  ini:'مق', c:'var(--green)',  bg:'rgba(46,164,79,.15)',   bdr:'#2ea44f', sheet:'محمد قريش'},
};
function whoKey(v){
  if(!v) return null;
  const s = String(v).trim();
  if(s.includes('حسين')) return 'hjm';
  if(s.includes('محمد')||s.includes('قريش')) return 'mq';
  return null;
}

// Month sheets present in the workbook, in order
const MSHEETS = [
  ['أغسطس 2026',202608],['سبتمبر 2026',202609],['أكتوبر 2026',202610],
  ['نوفمبر 2026',202611],['ديسمبر 2026',202612],['يناير 2027',202701],
  ['فبراير 2027',202702],['مارس 2027',202703],['أبريل 2027',202704],
  ['مايو 2027',202705],['يونيو 2027',202706],['يوليو 2027',202707],
  ['أغسطس 2027',202708]
];

// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
let DB = { monthlyExp: [], members: {}, rentStart:null, rentEnd:null, transfers: [] };

// ═══════════════════════════════════════════════════
// PARSE
// ═══════════════════════════════════════════════════
function parseWB(wb){
  DB = { monthlyExp: [], members: {}, rentStart:null, rentEnd:null, transfers: [] };

  // ── Monthly expense sheets: itemized payments per member per month ──
  for (const [sname, mk] of MSHEETS){
    const ws = wb.Sheets[sname];
    if(!ws){ DB.monthlyExp.push({mk,name:sname,items:[],total:0,share:0}); continue; }
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

    let curWho=null, items=[], total=0, share=0;
    for (const r of rows){
      const c0=r[0], c1=r[1], c2=r[2], c3=r[3];
      const s0=String(c0||'').trim(), s1=String(c1||'').trim();

      if (s0.startsWith('مدفوعات')){ curWho = whoKey(s0); continue; }
      if (s0==='التاريخ' && s1==='الوصف') continue;
      if (s1==='المجموع') continue; // section subtotal — recomputed from items
      if (s1==='المجموع الكلي'){ total = n(c2); continue; }
      if (s1.startsWith('القطة على كل شخص')){ share = n(c2); continue; }
      if (!curWho) continue;

      const amt = n(c2);
      if (amt<=0 || !s1) continue;
      let dateStr = (typeof c0==='number' && c0>40000) ? fmtDateShort(c0) : null;
      const paidBy = c3 ? whoKey(c3) : curWho;
      items.push({who: paidBy||curWho, desc:s1, amount:amt, date:dateStr});
    }
    DB.monthlyExp.push({mk, name:sname, items, total, share});
  }

  // ── Member ledger sheets ──
  DB.members.hjm = parseMemberSheet(wb, M.hjm.sheet);
  DB.members.mq  = parseMemberSheet(wb, M.mq.sheet);
  DB.rentStart = DB.members.hjm.rentStart || DB.members.mq.rentStart;
  DB.rentEnd   = DB.members.hjm.rentEnd   || DB.members.mq.rentEnd;
  DB.transfers = computeTransfers();

  render();
}

// A member's "مبلغ مدفوع" row is a REAL payment to the other person only if that member
// did NOT front the shared expense that month (checked against the monthly sheet's payer).
// If they did front it, that row is just their own bookkeeping (cancelling their own share)
// and isn't money that actually changed hands.
// Transfers are read directly from the explicit "مبلغ محول من X الى Y" rows in each
// member's own ledger (both an outgoing/negative row on the sender's sheet and a mirrored
// incoming/positive row on the receiver's sheet exist for every real transfer — we only take
// the negative (sender's) copy so each transfer is counted exactly once).
function computeTransfers(){
  const transfers = [];
  Object.keys(M).forEach(key=>{
    const ms = DB.members[key];
    if(!ms) return;
    ms.months.forEach(mo=>{
      (mo.transfers||[]).forEach(t=>{
        if(t.amount<0 && t.from && t.to){
          transfers.push({date:t.date, from:t.from, to:t.to, amount:Math.abs(t.amount), month:mo.name, mk:mo.mk});
        }
      });
    });
  });
  transfers.sort((a,b)=>b.mk-a.mk);
  return transfers;
}

function parseMemberSheet(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  if(!ws) return {months:[], rentStart:null, rentEnd:null, remaining:null};
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

  const months = {};
  let curMk = null, rentStart=null, rentEnd=null, remaining=null;

  function ensureMonth(mk, label){
    if(!months[mk]) months[mk] = {mk, name:label||mkLabel(mk), share:0, refund:0, payments:[], transfers:[]};
    return months[mk];
  }

  for (let i=0;i<rows.length;i++){
    const r = rows[i];
    const c0=r[0], c1=r[1], c2=r[2], c3=r[3];
    const s1 = String(c1||'').trim();
    const s3 = String(c3||'').trim();

    if (s1==='بداية الأجار'){ const nr=rows[i+1]; if(nr && typeof nr[1]==='number') rentStart=fmtDateFull(nr[1]); continue; }
    if (s1==='نهاية الأجار'){ const nr=rows[i+1]; if(nr && typeof nr[1]==='number') rentEnd=fmtDateFull(nr[1]); continue; }
    if (s3==='باقي المبالغ'){ const nr=rows[i+1]; if(nr && typeof nr[3]==='number') remaining=nr[3]; continue; }

    if (typeof c0==='string'){
      const mk = parseArMonth(c0);
      if (mk){ curMk=mk; ensureMonth(mk, c0.trim()); }
    }

    const desc = c2 ? String(c2).trim() : '';

    // The "المصروفات الشهرية المشتركة" row is the reliable start-of-month marker — if its own
    // date (col B) belongs to a different month than curMk (e.g. a missing/blank label cell),
    // trust the date and switch months, so one blank label can't corrupt the previous month's data.
    if (desc==='المصروفات الشهرية المشتركة' && typeof c1==='number' && c1>40000){
      const dateMk = serialParts(c1) ? (serialParts(c1).y*100+serialParts(c1).m) : null;
      if (dateMk && dateMk!==curMk){ curMk=dateMk; ensureMonth(dateMk); }
    }

    if (!curMk) continue;
    const mo = months[curMk];

    if (desc==='المصروفات الشهرية المشتركة'){ mo.share = n(c3); continue; }
    if (desc.startsWith('مبالغ مسترجعة')){ mo.refund = n(c3); continue; }
    if (desc==='مبلغ مدفوع'){
      if (c3!=null){
        const d = (typeof c1==='number' && c1>40000) ? fmtDateShort(c1) : '—';
        mo.payments.push({date:d, amount:Math.abs(n(c3))});
      }
      continue;
    }
    if (desc.startsWith('مبلغ محول')){
      if (c3!=null && typeof c3==='number' && c3!==0){
        const mobj = desc.match(/من\s+(\S+)\s+(?:الى|إلى)\s+(\S+)/);
        const fromKey = mobj ? whoKey(mobj[1]) : null;
        const toKey = mobj ? whoKey(mobj[2]) : null;
        const d = (typeof c1==='number' && c1>40000) ? fmtDateShort(c1) : '—';
        mo.transfers.push({date:d, amount:c3, from:fromKey, to:toKey});
      }
      continue;
    }
  }

  const monthList = Object.values(months).sort((a,b)=>a.mk-b.mk);

  monthList.forEach(mo=>{
    const paidSum = mo.payments.reduce((s,p)=>s+p.amount,0);
    const transferNet = (mo.transfers||[]).reduce((s,t)=>s+t.amount,0);
    // Balance = share (owed) + refund (credit) - old-style payments + signed net of transfers
    mo.balance = mo.share + mo.refund - paidSum + transferNet;
  });

  return {months: monthList, rentStart, rentEnd, remaining};
}

async function fetchCommit(){
  if(!RESOLVED_FILE) return;
  try{
    const comUrl = `https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(RESOLVED_FILE)}&per_page=1`;
    const r=await fetch(comUrl);
    if(r.ok){const c=await r.json();if(c&&c.length){
      const d=new Date(c[0].commit.committer.date);
      document.getElementById('file-time').textContent='آخر تحديث: '+d.toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});

// Tries each filename candidate against raw.githubusercontent.com until one returns 200.
// Returns {ok:true, buf, file} on success, or {ok:false, attempts:[{file,status}]} on failure.
async function tryLoadFile(){
  const attempts=[];
  for(const file of FILE_CANDIDATES){
    const url = `https://raw.githubusercontent.com/${REPO}/main/${encodeURIComponent(file)}?t=${Date.now()}`;
    try{
      const res = await fetch(url);
      attempts.push({file, status:res.status});
      if(res.ok){
        const buf = await res.arrayBuffer();
        return {ok:true, buf, file, attempts};
      }
    }catch(e){
      attempts.push({file, status:'network error'});
    }
  }
  return {ok:false, attempts};
}

async function loadGH(){
  setBanner('L','⏳ جاري تحميل البيانات من GitHub...');
  setSpin(true);
  try{
    const result = await tryLoadFile();
    if(!result.ok){
      const list = result.attempts.map(a=>`«${a.file}» → ${a.status}`).join(' | ');
      throw new Error('لم يتم العثور على ملف الإكسل في المستودع. الأسماء التي تم تجربتها: '+list+
        `. تأكد أن اسم الملف في GitHub (${REPO}) يطابق أحد هذه الأسماء بالضبط (حساس لحالة الأحرف).`);
    }
    RESOLVED_FILE = result.file;
    const wb=XLSX.read(new Uint8Array(result.buf),{type:'array',cellDates:false,raw:false});
    const raw=XLSX.write(wb,{type:'base64',bookType:'xlsx'});
    localStorage.setItem(CACHE_K,raw);
    localStorage.setItem(CACHE_K+'_ts',Date.now());
    localStorage.setItem(CACHE_K+'_file',RESOLVED_FILE);
    parseWB(wb);
    setBanner('S',`✅ تم التحميل من GitHub بنجاح (${RESOLVED_FILE})`);
    setTimeout(()=>document.getElementById('banner').style.display='none',3000);
    fetchCommit();
  }catch(e){setBanner('E','❌ '+e.message);}
  setSpin(false);
}

async function syncNow(){await loadGH();}

async function init(){
  const cached=localStorage.getItem(CACHE_K);
  const ts=parseInt(localStorage.getItem(CACHE_K+'_ts')||'0');
  if(cached&&Date.now()-ts<30*60*1000){
    try{
      const buf=Uint8Array.from(atob(cached),c=>c.charCodeAt(0)).buffer;
      const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:false,raw:false});
      parseWB(wb);
      RESOLVED_FILE = localStorage.getItem(CACHE_K+'_file');
      setBanner('L','📦 من الكاش — اضغط "مزامنة" للتحديث');
      fetchCommit();
      return;
    }catch(e){localStorage.removeItem(CACHE_K);}
  }
  await loadGH();
}
init();
</script>
